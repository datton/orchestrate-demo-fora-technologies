<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260" role="img" aria-label="Six stages in a row linked by a path: menu, order, till, payment, review, signage">
  <title>The in-venue journey, from menu to review</title>
  <rect width="800" height="260" rx="20" fill="#f6e6d8"/>
  <path d="M70 140 C160 80 220 200 320 140 S480 80 560 140 S700 200 740 140" fill="none" stroke="#b5441f" stroke-width="4" stroke-dasharray="3 12" stroke-linecap="round"/>
  <g fill="#fbf6ef" stroke="#2b1d16" stroke-width="3">
    <circle cx="70" cy="140" r="26"/><circle cx="196" cy="150" r="26"/><circle cx="320" cy="140" r="26"/>
    <circle cx="440" cy="118" r="26"/><circle cx="560" cy="140" r="26"/><circle cx="680" cy="158" r="26"/>
  </g>
  <g fill="#1c6a63" font-family="Georgia, serif" font-size="22" font-weight="700" text-anchor="middle">
    <text x="70" y="148">1</text><text x="196" y="158">2</text><text x="320" y="148">3</text>
    <text x="440" y="126">4</text><text x="560" y="148">5</text><text x="680" y="166">6</text>
